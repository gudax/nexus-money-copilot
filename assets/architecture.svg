<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f897e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c43d2e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#117a4d"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#faf9f7"/>
  <text x="40" y="46" fill="#1c1b18" font-size="22" font-weight="700" letter-spacing="-0.4">NEXUS Money Copilot — audited ADK/A2A fleet, one Cloud Run container</text>
  <text x="40" y="70" fill="#8f897e" font-size="13" font-family="Menlo, monospace">Track 1 · Google for Startups AI Agents Challenge 2026 · Gemini on Vertex AI</text>

  <!-- user / clients -->
  <rect x="40" y="100" width="220" height="64" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="150" y="127" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">User (web + Toss)</text>
  <text x="150" y="148" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">web demo · Toss miniapp line</text>

  <!-- Cloud Run container boundary -->
  <rect x="40" y="196" width="1000" height="318" rx="10" fill="none" stroke="#2f6db0" stroke-dasharray="6 5"/>
  <text x="58" y="220" fill="#2f6db0" font-size="12" font-weight="600" font-family="Menlo, monospace">Cloud Run — single container (launcher.sh boots 3 processes)</text>

  <!-- service -->
  <rect x="70" y="240" width="280" height="100" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="210" y="266" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">copilot service (FastAPI)</text>
  <text x="210" y="287" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">orchestrator · ADK Agent</text>
  <text x="210" y="306" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">RemoteA2aAgent x2 as AgentTool</text>
  <text x="210" y="325" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">Gemini (Vertex AI)</text>

  <!-- workers -->
  <rect x="430" y="240" width="260" height="64" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="560" y="265" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">markets worker · :8101</text>
  <text x="560" y="287" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">LlmAgent via to_a2a() · AgentCard</text>

  <rect x="430" y="324" width="260" height="64" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="560" y="349" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">account worker · :8102</text>
  <text x="560" y="371" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">READ-ONLY · GET-only allowlist</text>

  <!-- LMX -->
  <rect x="790" y="240" width="220" height="148" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="900" y="266" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">LMX exchange API</text>
  <text x="900" y="288" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">82 live instruments</text>
  <text x="900" y="307" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">candles · news · calendar</text>
  <text x="900" y="326" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">demo brokerage account</text>
  <text x="900" y="350" fill="#117a4d" font-size="12" text-anchor="middle" font-family="Menlo, monospace">raw JSON &#8594; truth_log</text>
  <text x="900" y="369" fill="#8f897e" font-size="11" text-anchor="middle" font-family="Menlo, monospace">(captured at the tool seam)</text>

  <!-- vision -->
  <rect x="70" y="380" width="280" height="80" rx="8" fill="#ffffff" stroke="#d6d0c4"/>
  <text x="210" y="406" fill="#1c1b18" font-size="14" font-weight="600" text-anchor="middle">vision pipeline</text>
  <text x="210" y="426" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">Gemini reads the screenshot</text>
  <text x="210" y="445" fill="#8f897e" font-size="12" text-anchor="middle" font-family="Menlo, monospace">code does the arithmetic</text>

  <!-- auditor (hero, clay) -->
  <rect x="430" y="420" width="580" height="74" rx="8" fill="#fbece4" stroke="#cc5a36" stroke-width="2"/>
  <text x="720" y="447" fill="#9e4527" font-size="15" font-weight="700" text-anchor="middle">Answer Auditor — deterministic, no model in the loop</text>
  <text x="720" y="470" fill="#565049" font-size="12" text-anchor="middle" font-family="Menlo, monospace">numbers must match raw exchange JSON +/-3% · advice tripwire (imperative + soft)</text>
  <text x="720" y="487" fill="#8f897e" font-size="11" text-anchor="middle" font-family="Menlo, monospace">verdict ships on every answer card: + Verified / x Blocked · fail closed</text>

  <!-- edges -->
  <line x1="150" y1="164" x2="150" y2="240" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="190" fill="#8f897e" font-size="11" font-family="Menlo, monospace">POST /v1/ask</text>

  <line x1="350" y1="272" x2="430" y2="272" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="263" fill="#8f897e" font-size="11" font-family="Menlo, monospace">A2A</text>
  <line x1="350" y1="320" x2="430" y2="352" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="346" fill="#8f897e" font-size="11" font-family="Menlo, monospace">A2A</text>

  <line x1="690" y1="272" x2="790" y2="290" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="356" x2="790" y2="336" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="706" y="320" fill="#8f897e" font-size="11" font-family="Menlo, monospace">GET (allowlist)</text>

  <line x1="900" y1="388" x2="900" y2="457" stroke="#117a4d" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="908" y="410" fill="#117a4d" font-size="11" font-family="Menlo, monospace">raw truth</text>

  <line x1="210" y1="340" x2="210" y2="380" stroke="#8f897e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="440" x2="430" y2="450" stroke="#117a4d" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="356" y="432" fill="#117a4d" font-size="11" font-family="Menlo, monospace">pre-verified numbers</text>

  <path d="M430,466 L240,466 L222,348" fill="none" stroke="#c43d2e" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="252" y="482" fill="#c43d2e" font-size="11" font-family="Menlo, monospace">final answer audited before it ships</text>

  <!-- footer -->
  <text x="40" y="556" fill="#8f897e" font-size="12" font-family="Menlo, monospace">Stack: google-adk[a2a] 2.1.0 · LlmAgent · to_a2a() · RemoteA2aAgent · AgentTool · InMemoryRunner · gemini-flash on Vertex AI</text>
  <text x="40" y="578" fill="#8f897e" font-size="12" font-family="Menlo, monospace">Guarantee: a blocked answer never reaches the user — honesty is enforced by code, not by prompts.</text>
  <text x="40" y="612" fill="#b8b2a6" font-size="11" font-family="Menlo, monospace">github.com/gudax/nexus-money-copilot · money-copilot-675241948019.asia-northeast1.run.app · Nexus AI Labs, Seoul</text>
</svg>
